name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The suite is a few seconds long, so the race detector rides every run
      # rather than a separate scheduled job.
      - name: Test (race)
        run: go test -race ./...

      # go run rather than a marketplace action: nothing extra to SHA-pin,
      # and it is exactly what a developer runs locally.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
